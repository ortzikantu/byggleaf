# ByggLeaf 只在一处配置。没有 [theme] 块，因为没有主题系统；
# 下面的值就是全部公开配置面。
[site]
# title 只用于 <head>、og 与 feed；hero_title 是首页显示的大标题。
title = "My Digital Garden"
hero_title = "My Digital Garden"
hero_subtitle = "用代码和文字记录生活。"
baseurl = "https://example.com"
copyright = "Your Name"
language = "zh-CN"
posts_per_page = 5


[[projects]]
name = "Example"
url = "https://github.com/example/example"
description = "Example."

# 页脚链接：站外地址照原样，站内路径会经 baseurl 拼接。写几条就列几条，竖排。
